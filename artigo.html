                        <h2>O que é HTML Semântico?</h2>
                        <p>O <strong>HTML</strong> é a linguagem que monta a estrutura da página. Cada parte do conteúdo é marcada por uma <strong>tag</strong>, como <code>&lt;p&gt;</code> para parágrafo. Tags <strong>semânticas</strong> dizem qual é o papel do conteúdo, e não só como ele aparece.</p>
                        <p>Por que isso importa? Leitores de tela (usados por pessoas com deficiência visual) e o Google entendem melhor uma página bem organizada. Por isso, usar tags semânticas melhora a <strong>acessibilidade</strong> e o <strong>SEO</strong>, que é a otimização para motores de busca.</p>
                        <h2>As principais tags semânticas</h2>
                        <p><code>&lt;nav&gt;</code> agrupa os links do menu principal. <code>&lt;main&gt;</code> marca o conteúdo principal da página, sem o cabeçalho e o rodapé. <code>&lt;section&gt;</code> agrupa partes relacionadas por assunto. <code>&lt;article&gt;</code> é um conteúdo completo e independente, como uma notícia ou um post.</p>
                        <p><code>&lt;header&gt;</code> é o cabeçalho e <code>&lt;footer&gt;</code> é o rodapé, onde ficam direitos autorais e contatos. Já o atributo <code>lang</code> na tag <code>&lt;html&gt;</code>, como em <code>lang="pt-BR"</code>, informa o idioma da página para os leitores de tela.</p>

                        <h2>O que é CSS?</h2>
                        <p>O <strong>CSS</strong> (Cascading Style Sheets) define a aparência da página: cores, fontes, tamanhos e espaçamentos. Ele funciona com regras: um <strong>seletor</strong> escolhe o elemento, e uma <strong>propriedade</strong> com um <strong>valor</strong> define o estilo. Exemplo: <code>p { font-size: 18px; }</code> deixa os parágrafos com letra de 18 pixels.</p>
                        <p>Para selecionar uma <strong>classe</strong>, use o ponto antes do nome, como em <code>.cartao</code>. Para selecionar um <strong>ID</strong>, que deve ser único na página, use a cerquilha, como em <code>#menu</code>. A propriedade <code>background-color</code> muda a cor de fundo, e a <code>font-size</code> muda o tamanho da letra.</p>

                        <p>O <strong>Flexbox</strong> organiza elementos em uma linha ou coluna, e o <strong>CSS Grid</strong> cria layouts em linhas e colunas ao mesmo tempo. As <strong>Media Queries</strong> mudam o estilo conforme o tamanho da tela. O <code>z-index</code> controla qual elemento fica na frente, e o <code>:hover</code> aplica estilo quando o mouse passa sobre o elemento.</p>

                        <p>O <strong>C#</strong> é uma linguagem orientada a objetos e <strong>fortemente tipada</strong>: cada variável tem um tipo definido. Ela roda no <strong>.NET</strong>, que traz o <strong>CLR</strong> (Common Language Runtime), o ambiente de execução que gerencia o código. O <strong>SDK do .NET</strong> reúne as ferramentas para desenvolver e rodar aplicações.</p>
                        <p>Os tipos mais comuns são: <code>int</code> para números inteiros, <code>string</code> para texto, <code>bool</code> para verdadeiro ou falso e <code>float</code> para números com casas decimais. Exemplo: <code>int idade = 18;</code>. Se você tentar guardar um texto em um <code>int</code>, o código nem compila: é um <strong>erro de compilação</strong>.</p>

                        <p>O <strong>Garbage Collector</strong> é o sistema automático que libera a memória dos objetos que não são mais usados. Você não precisa apagar a memória na mão.</p>

                        <p>Os modificadores de acesso controlam quem pode ver um membro. <code>public</code> deixa acessível para todos, <code>protected</code> para as classes filhas e <code>private</code> só dentro da própria classe. Já <code>static</code> faz o membro pertencer à classe, e não a um objeto específico.</p>

                        <p>O <strong>SQL</strong> é a linguagem para trabalhar com essas tabelas. O comando <code>SELECT</code> busca dados, como em <code>SELECT nome FROM alunos;</code>. Para filtrar, use <code>WHERE</code>, como em <code>WHERE idade &gt; 18</code>.</p>

                        <p>O <strong>Scrum</strong> é uma metodologia ágil que trabalha em ciclos curtos chamados <strong>Sprints</strong>, que duram de <strong>1 a 4 semanas</strong>. O <strong>Product Owner (PO)</strong> prioriza o Backlog. O <strong>Scrum Master</strong> facilita o processo e remove obstáculos do time.</p>

                        <p>A <strong>escuta ativa</strong> significa compreender verdadeiramente o que o outro comunica — prestando atenção total, sem interromper e fazendo perguntas para confirmar o entendimento. O <strong>feedback construtivo</strong> é um retorno que aponta melhorias de forma respeitosa e específica.</p>

                        <p>A Libras <strong>não é universal</strong> — cada país tem sua própria língua de sinais (nos EUA é o ASL, na França é o LSF, etc.). Ela também <strong>não é mímica</strong>: é uma língua completa com gramática, sintaxe e estrutura próprias. A <strong>Datilologia</strong> é o uso do alfabeto manual para soletrar palavras.</p>
