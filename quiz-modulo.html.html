<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSaber+ | Quiz</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz-modulo.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* CARTÃO DE CÓDIGO: pergunta + linha de código com espaço vazio */
        .pagina-quiz .codigo-cartao {
            margin: 0 0 1.25rem;
            border-radius: 18px;
            overflow: hidden;
            background: #0f172a;
            border: 2px solid transparent;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.22);
            transition: border-color 0.3s ease;
        }

        .pagina-quiz .codigo-cartao--certo  { border-color: #22c55e; }
        .pagina-quiz .codigo-cartao--errado { border-color: #ef4444; }

        .pagina-quiz .codigo-cartao__barra {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1rem;
            background: #1e293b;
        }

        .pagina-quiz .codigo-cartao__barra span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #475569;
        }

        .pagina-quiz .codigo-cartao__barra span:nth-child(1) { background: #f87171; }
        .pagina-quiz .codigo-cartao__barra span:nth-child(2) { background: #fbbf24; }
        .pagina-quiz .codigo-cartao__barra span:nth-child(3) { background: #4ade80; }

        .pagina-quiz .codigo-cartao__barra small {
            margin-left: auto;
            color: #94a3b8;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.75rem;
        }

        .pagina-quiz .codigo-linha {
            margin: 0;
            padding: 1.4rem 1.25rem;
            font-family: Consolas, 'Courier New', monospace;
            font-size: clamp(1rem, 2.6vw, 1.2rem);
            line-height: 1.9;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .pagina-quiz .lacuna {
            display: inline-block;
            min-width: 4.5ch;
            padding: 0 0.3rem;
            margin: 0 0.1rem;
            text-align: center;
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 2px dashed #38bdf8;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .pagina-quiz .lacuna--vazia { color: #64748b; border-bottom-color: #64748b; }
        .pagina-quiz .lacuna--certo  { color: #4ade80; border-bottom: 2px solid #4ade80; }
        .pagina-quiz .lacuna--errado { color: #f87171; border-bottom: 2px solid #f87171; }

        /* alternativas em formato de código */
        .pagina-quiz .quiz-opcoes.com-codigo .opcao-texto {
            font-family: Consolas, 'Courier New', monospace;
            font-weight: 600;
        }

        .pagina-quiz .quiz-opcao[aria-disabled="true"] { cursor: default; }

        .pagina-quiz .quiz-feedback {
            min-height: 1.5em;
            margin: 0.9rem 0 0;
            font-size: 0.95rem;
            font-weight: 500;
            color: #334155;
        }

        .pagina-quiz .quiz-feedback--certo  { color: #15803d; }
        .pagina-quiz .quiz-feedback--errado { color: #b91c1c; }

        .pagina-quiz .quiz-dica {
            margin: 0 0 0.9rem;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>

<body class="pagina-quiz">

    <!-- NAVBAR -->
    <header class="topo">
        <nav class="topo-nav">
            <a href="dashboard-aluno.html" class="logo">TechSaber+</a>

        </nav>
    </header>

    <main class="quiz-main">

        <header class="quiz-cabecalho">
            <p class="eyebrow">Avaliação</p>
            <h1 id="quiz-titulo"></h1>
            <p class="quiz-progresso" id="quiz-progresso"></p>
            <div class="quiz-barra" aria-hidden="true">
                <span class="quiz-barra__preench" id="quiz-barra-preench"></span>
            </div>
        </header>

        <!-- CARD DA QUESTÃO ATUAL -->
        <section class="quiz-card" id="quiz-card">
            <h2 id="quiz-pergunta"></h2>

            <!-- Cartão de código (preenchido pelo JS quando a questão tem código) -->
            <div id="quiz-codigo-area"></div>

            <p class="quiz-dica" id="quiz-dica">Escolha a alternativa que completa o código.</p>

            <ul class="quiz-opcoes" id="quiz-opcoes"></ul>

            <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>

            <button class="btn-cta btn-enviar" id="btn-enviar" disabled>
                Confirmar resposta
            </button>
        </section>

    </main>

                    ]
                }
            },
            "Banco-de-Dados": {
                quiz1: {
                    titulo: "QUIZ SQL BÁSICO — Banco de Dados",
                    perguntas: [
                        { pergunta: "Qual comando busca dados de uma tabela?", codigo: "___ nome FROM alunos;", opcoes: ["SELECT", "INSERT", "UPDATE", "DELETE"], correta: 0 },

                        { pergunta: "Qual comando altera dados que já existem?", codigo: "___ alunos SET idade = 20 WHERE id = 3;", opcoes: ["INSERT", "CHANGE", "UPDATE", "ALTER"], correta: 2 }
                    ]
                },
                quiz2: {
                    titulo: "QUIZ SQL AVANÇADO — Banco de Dados",
                    perguntas: [
                        { pergunta: "Qual comando inicia uma transação?", codigo: "___ TRANSACTION;", opcoes: ["BEGIN", "START", "OPEN", "RUN"], correta: 0 },

                    ]
                },
                quiz2: {
                    titulo: "QUIZ PRÁTICAS AVANÇADAS — Engenharia de Software",
                    perguntas: [
                        { pergunta: "O que é a Integração Contínua (CI)?", codigo: "A ___ Contínua junta o código de todos várias vezes ao dia.", opcoes: ["Integração", "Entrega", "Revisão", "Reunião"], correta: 0 },
                        { pergunta: "O que é Dívida Técnica?", codigo: "A Dívida ___ é o custo futuro de corrigir escolhas rápidas.", opcoes: ["Ágil", "Extra", "Técnica", "Financeira"], correta: 2 },
                        { pergunta: "O que é Refatoração?", codigo: "Refatorar é melhorar a ___ do código sem mudar o comportamento.", opcoes: ["cor", "estrutura", "velocidade", "dono"], correta: 1 },
                        { pergunta: "O que é um MVP?", codigo: "O MVP é a versão ___ de um produto, para validar no mercado.", opcoes: ["final", "completa", "mais simples", "mais cara"], correta: 2 },
                        { pergunta: "O que o Manifesto Ágil prioriza?", codigo: "O Manifesto Ágil prioriza ___ e entregas sobre processos rígidos.", opcoes: ["ferramentas", "pessoas", "contratos", "prazos"], correta: 1 }
                    ]
                }
            },
            "Soft-Skills": {
                quiz1: {
                    titulo: "QUIZ COMUNICAÇÃO — Soft Skills",
                    perguntas: [
                        { pergunta: "O que é comunicação assertiva?", opcoes: ["Falar muito alto", "Expressar ideias com clareza e respeito", "Evitar conflitos", "Comunicar só por escrito"], correta: 1 },
                        { pergunta: "O que é escuta ativa?", opcoes: ["Ouvir sem prestar atenção", "Compreender verdadeiramente o que o outro comunica", "Apenas para reuniões formais", "Somente para líderes"], correta: 1 },
                        { pergunta: "O que exige o trabalho em equipe?", opcoes: ["Competição entre membros", "Trabalho individual", "Empatia, respeito e foco no objetivo comum", "Hierarquia rígida"], correta: 2 },
                        { pergunta: "O que é proatividade?", opcoes: ["Esperar ordens", "Agir antecipadamente sem ser solicitado", "Fazer o mínimo", "Delegar tudo"], correta: 1 },
                        { pergunta: "O que é feedback construtivo?", opcoes: ["Crítica sem solução", "Retorno que aponta melhorias de forma respeitosa", "Elogio exagerado", "Avaliação anual"], correta: 1 }
                    ]
                },
                quiz2: {
                    titulo: "QUIZ LIDERANÇA — Soft Skills",
                    perguntas: [
                        { pergunta: "O que envolve a liderança?", opcoes: ["Controlar e punir", "Inspirar e motivar equipes", "Fazer tudo sozinho", "Evitar decisões"], correta: 1 },
                        { pergunta: "Para que serve a inteligência emocional?", opcoes: ["Memorizar informações", "Aumentar velocidade de digitação", "Gerenciar conflitos e tomar decisões equilibradas", "Aprender idiomas"], correta: 2 },
                        { pergunta: "O que é resiliência profissional?", opcoes: ["Evitar desafios", "Capacidade de se adaptar e superar adversidades", "Nunca errar", "Trabalhar sob pressão"], correta: 1 },

                        { pergunta: "O que é gestão do tempo?", opcoes: ["Trabalhar mais horas", "Organizar prioridades e aumentar produtividade", "Fazer várias coisas ao mesmo tempo", "Delegar tudo"], correta: 1 }
                    ]
                }
            },

                    perguntas: [

                        { pergunta: "Libras é universal?", opcoes: ["Sim, mundial", "Não, cada país tem a sua", "Sim, padronizada pela ONU", "Não, só América Latina"], correta: 1 },
                        { pergunta: "O que é Datilologia?", opcoes: ["Estudo dos dedos", "Uso do alfabeto manual para soletrar palavras", "Técnica de digitação", "Leitura labial"], correta: 1 },
                        { pergunta: "Libras é mímica?", opcoes: ["Sim, apenas gestos", "Não, é uma língua completa com gramática própria", "Sim, mas com regras", "Não, é código morse"], correta: 1 },
                        { pergunta: "Expressão facial é importante em Libras?", opcoes: ["Não, só as mãos", "Sim, transmite entonação e sentido à frase", "Só em situações formais", "Apenas para iniciantes"], correta: 1 }
                    ]
                },
                quiz2: {
                    titulo: "QUIZ GRAMÁTICA LIBRAS — Acessibilidade",
                    perguntas: [
                        { pergunta: "Qual a lei da Libras no Brasil?", opcoes: ["Lei 8.069/1990", "Lei 10.436/2002", "Lei 13.146/2015", "Lei 9.394/1996"], correta: 1 },
                        { pergunta: "O que são os Classificadores?", opcoes: ["Categorias gramaticais", "Sinais que descrevem formas, tamanhos ou ações", "Tipos de alfabetos", "Expressões faciais"], correta: 1 },

        /* Lê curso e quiz da URL */
        const params    = new URLSearchParams(window.location.search);
        const cursoKey  = bancoCursos[params.get("curso")] ? params.get("curso") : "Front-End";
        const quizNum   = params.get("quiz") === "2" ? "2" : "1";
        const dadosCurso = bancoCursos[cursoKey];
        const quiz      = quizNum === "2" ? dadosCurso.quiz2 : dadosCurso.quiz1;

        const LETRAS = ["A", "B", "C", "D"];
        const $ = (id) => document.getElementById(id);

        let atual     = 0;
        let acertos   = 0;
        let escolhida = null;
        let confirmado = false;

        $("quiz-titulo").textContent = quiz.titulo;

        /* Desenha o cartão de código.
           textoPreenchido: alternativa escolhida (ou null, se ainda não escolheu)
           estado: "" | "certo" | "errado" */
        function desenharCodigo(q, textoPreenchido, estado) {
            const area = $("quiz-codigo-area");
            area.innerHTML = "";
            if (!q.codigo) return;

            const cartao = document.createElement("div");
            cartao.className = "codigo-cartao" + (estado ? " codigo-cartao--" + estado : "");
            cartao.innerHTML = '<div class="codigo-cartao__barra" aria-hidden="true"><span></span><span></span><span></span><small>código</small></div>';

            const linha = document.createElement("pre");
            linha.className = "codigo-linha";
            linha.setAttribute("aria-label", "Trecho de código com espaço para completar");

            const partes = q.codigo.split("___");
            partes.forEach((parte, i) => {
                linha.appendChild(document.createTextNode(parte));
                if (i < partes.length - 1) {
                    const lacuna = document.createElement("span");
                    if (textoPreenchido) {
                        lacuna.className = "lacuna" + (estado ? " lacuna--" + estado : "");
                        lacuna.textContent = textoPreenchido;
                    } else {
                        lacuna.className = "lacuna lacuna--vazia";
                        lacuna.textContent = "____";
                    }
                    linha.appendChild(lacuna);
                }
            });

            cartao.appendChild(linha);
            area.appendChild(cartao);
        }

        /* Mostra a pergunta atual */
        function mostrarPergunta() {
            const q     = quiz.perguntas[atual];
            const total = quiz.perguntas.length;

            escolhida  = null;
            confirmado = false;

            $("quiz-progresso").textContent = `Pergunta ${atual + 1} de ${total}`;
            $("quiz-barra-preench").style.width = ((atual / total) * 100) + "%";
            $("quiz-pergunta").textContent = `${atual + 1}. ${q.pergunta}`;

            $("quiz-dica").style.display = q.codigo ? "block" : "none";

            const feedback = $("quiz-feedback");
            feedback.textContent = "";
            feedback.className = "quiz-feedback";

            desenharCodigo(q, null, "");

            const ul = $("quiz-opcoes");
            ul.innerHTML = "";
            ul.classList.toggle("com-codigo", Boolean(q.codigo));

            q.opcoes.forEach((opcao, i) => {
                const li = document.createElement("li");
                li.className = "quiz-opcao";
                li.setAttribute("tabindex", "0");
                li.setAttribute("role", "button");
                li.setAttribute("aria-pressed", "false");

                const letra = document.createElement("span");
                letra.className = "opcao-letra";
                letra.textContent = LETRAS[i];

                const texto = document.createElement("span");
                texto.className = "opcao-texto";
                texto.textContent = opcao;

                li.append(letra, texto);
                li.addEventListener("click", () => selecionar(i));
                li.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        selecionar(i);
                    }
                });
                ul.appendChild(li);
            });

            const btn = $("btn-enviar");
            btn.textContent = "Confirmar resposta";
            btn.disabled = true;
        }

        /* Ao clicar, a alternativa preenche o código em tempo real */
        function selecionar(indice) {
            if (confirmado) return;

            const q = quiz.perguntas[atual];
            escolhida = indice;

            document.querySelectorAll(".quiz-opcao").forEach((li, j) => {
                li.classList.toggle("selecionada", j === indice);
                li.setAttribute("aria-pressed", j === indice ? "true" : "false");
            });

            $("btn-enviar").disabled = false;
            if (q.codigo) desenharCodigo(q, q.opcoes[indice], "");
        }

        /* Confirma: verde se acertou, vermelho se errou */
        function confirmar() {
            if (escolhida === null || confirmado) return;

            const q     = quiz.perguntas[atual];
            const total = quiz.perguntas.length;
            const acertou = escolhida === q.correta;

            confirmado = true;
            if (acertou) acertos++;

            document.querySelectorAll(".quiz-opcao").forEach((li, j) => {
                li.classList.remove("selecionada");
                li.classList.add("respondida");
                li.removeAttribute("tabindex");
                li.setAttribute("aria-disabled", "true");
                if (j === q.correta) li.classList.add("correta");
                else if (j === escolhida) li.classList.add("errada");
            });

            if (q.codigo) {
                desenharCodigo(q, q.opcoes[escolhida], acertou ? "certo" : "errado");
            }

            const feedback = $("quiz-feedback");
            feedback.className = "quiz-feedback " + (acertou ? "quiz-feedback--certo" : "quiz-feedback--errado");
            feedback.textContent = acertou
                ? "Isso mesmo! O código ficou completo."
                : `Não foi dessa vez. A alternativa certa é ${LETRAS[q.correta]}: ${q.opcoes[q.correta]}.`;

            const btn = $("btn-enviar");
            btn.textContent = atual + 1 < total ? "Próxima pergunta" : "Ver resultado";
            btn.disabled = false;
        }

        function proxima() {
            atual++;
            if (atual < quiz.perguntas.length) {
                mostrarPergunta();
            } else {
                mostrarResultado();
            }
        }

        /* Tela final: 3 de 5 para passar */
        function mostrarResultado() {
            const total  = quiz.perguntas.length;
            const passou = acertos >= 3;

            $("quiz-barra-preench").style.width = "100%";

            if (passou) {
                try {
                    const progressoKey  = `progresso-${cursoKey}`;
                    const novoProgresso = quizNum === "2" ? 4 : 3;
                    const anterior      = parseInt(localStorage.getItem(progressoKey) || "0", 10);
                    if (anterior < novoProgresso) {
                        localStorage.setItem(progressoKey, String(novoProgresso));
                    }
                } catch (e) {
                    /* sem localStorage: a trilha simplesmente não é atualizada */
                }
            }
            if (window.TechSaberXP) TechSaberXP.ganhar("quiz-" + cursoKey + "-" + quizNum, 100, "quiz concluído");
            const proximoLink = passou
                ? (quizNum === "2"
                    ? `avaliacao.html?curso=${cursoKey}`
                    : `quiz-modulo.html?curso=${cursoKey}&quiz=2`)
                : `quiz-modulo.html?curso=${cursoKey}&quiz=${quizNum}`;

            const proximoTexto = passou
                ? (quizNum === "2" ? "Ir para a avaliação final" : "Próximo: Quiz 2")
                : "Tentar novamente";

            document.querySelector(".quiz-main").innerHTML = `
                <section class="resultado-card" aria-live="polite">
                    <p class="eyebrow">${passou ? "Concluído" : "Quase lá"}</p>
                    <h1>${passou ? "Parabéns!" : "Continue praticando"}</h1>
                    <div class="resultado-numero"><span>${acertos}</span><small>/ ${total}</small></div>
                    <p class="resultado-texto">${passou
                        ? "Você acertou o suficiente para avançar para a próxima etapa."
                        : "Você precisa acertar pelo menos 3 questões para avançar."}</p>
                    <nav class="resultado-botoes">
                        <a href="${proximoLink}" class="btn-cta">${proximoTexto}</a>
                        <a href="curso.html?curso=${cursoKey}" class="btn-vidro">Ver trilha</a>
                    </nav>
                </section>
            `;
        }

        $("btn-enviar").addEventListener("click", () => {
            if (confirmado) proxima();
            else confirmar();
        });

        mostrarPergunta();
    </script>

    <script src="js/xp.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
