<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSaber+ | Perfil</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="pagina-perfil">

    <!-- NAVBAR -->
    <header class="topo">
        <nav class="topo-nav">
            <a href="dashboard-aluno.html" class="logo">TechSaber+</a>
            <div class="topo-botoes">
                <a href="dashboard-aluno.html" class="btn-voltar-pagina">Voltar</a>
            </div>
        </nav>
    </header>

    <main class="perfil-main">

        <!-- IDENTIDADE: avatar, nome e curso atual -->
        <section class="perfil-identidade card-vidro">
            <div class="avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
                </svg>
            </div>
            <div class="perfil-texto">
                <h1 id="nome-perfil">Aluno</h1>
                <p class="curso-atual" id="curso-atual">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    Front-end · Andamento
                </p>
            </div>
        </section>

        <!-- SEQUÊNCIA DE DIAS -->
        <section class="perfil-ofensiva card-vidro">
            <span class="ofensiva__icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                </svg>
            </span>
            <strong class="ofensiva__numero" id="dias-perfil" data-ofensiva>0</strong>
            <span class="ofensiva__rotulo">Dias consecutivos</span>
            <div class="ofensiva__barra" id="barra-perfil" aria-hidden="true"></div>
        </section>

        <!-- ESTATÍSTICAS -->
        <section class="perfil-stats" aria-label="Estatísticas">

            <article class="stat-card card-vidro">
                <span class="stat-card__icone stat-card__icone--azul" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
                </span>
                <span class="stat-card__rotulo">Cursos iniciados</span>
                <strong class="stat-card__valor" id="cursos-iniciados">0</strong>
            </article>

            <article class="stat-card card-vidro">
                <span class="stat-card__icone stat-card__icone--ciano" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
                </span>
                <span class="stat-card__rotulo">Dias ativos</span>
                <strong class="stat-card__valor" id="dias-ativos" data-dias-ativos>0</strong>
            </article>

            <article class="stat-card card-vidro">
                <span class="stat-card__icone stat-card__icone--verde" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
                <span class="stat-card__rotulo">Etapas concluídas</span>
                <strong class="stat-card__valor"><span id="etapas-feitas">0</span> <small>/ 35</small></strong>
            </article>

            <article class="stat-card card-vidro">
                <span class="stat-card__icone stat-card__icone--azul" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.9L22 10l-5.5 4.8L18.2 22 12 18.3 5.8 22l1.7-7.2L2 10l7.1-1.1z"/></svg>
                </span>
                <span class="stat-card__rotulo">XP total</span>
                <strong class="stat-card__valor"><span id="xp-total">0</span> <small>· Nível <span id="xp-nivel">1</span></small></strong>
            </article>

        </section>

    </main>

    <script src="js/ofensiva.js"></script>
    <script>
        /* Preenche o perfil com os dados reais salvos no navegador.
           Sem dados, tudo começa em zero. */
        (function () {
            const CURSOS = [
                "Front-End", "Back-End", "Banco-de-Dados", "Engenharia-de-Software",
                "Soft-Skills", "Acessibilidade-Libras", "Inteligencia-Artificial"
            ];
            const ofensiva = window.TechSaberOfensiva;
            const dias = ofensiva ? ofensiva.ler() : 0;
            const ativos = ofensiva ? ofensiva.diasAtivos() : 0;

            function lerTexto(chave) {
                try {
                    return localStorage.getItem(chave);
                } catch (e) {
                    return null;
                }
            }

            /* etapas: 0 a 5 por curso (artigo 1, artigo 2, quiz 1, quiz 2, avaliação) */
            let cursosIniciados = 0;
            let etapasFeitas = 0;
            CURSOS.forEach((curso) => {
                const p = parseInt(lerTexto("progresso-" + curso) || "0", 10) || 0;
                const concluido = lerTexto("concluido-" + curso) === "true";
                const etapas = concluido ? 5 : Math.min(p, 5);
                if (etapas > 0) cursosIniciados++;
                etapasFeitas += etapas;
            });

            document.getElementById("dias-perfil").textContent = dias;
            document.getElementById("dias-ativos").textContent = ativos;
            document.getElementById("cursos-iniciados").textContent = cursosIniciados;
            document.getElementById("etapas-feitas").textContent = etapasFeitas;

            /* curso atual: o último que a pessoa abriu na trilha */
            const nomeCurso = lerTexto("ultimoCursoNome");
            const cursoAtual = document.getElementById("curso-atual");
            if (cursoAtual && cursoAtual.lastChild) {
                cursoAtual.lastChild.textContent = " " + (nomeCurso || "Nenhum curso iniciado ainda");
            }

            /* XP e nível (guardados pelo js/xp.js nas outras páginas) */
            const xp = parseInt(lerTexto("xpTotal") || "0", 10) || 0;
            document.getElementById("xp-total").textContent = xp;
            document.getElementById("xp-nivel").textContent = xp >= 150 ? 2 : 1;

            /* barra de dias: 7 segmentos, preenchidos conforme a sequência */
            const barra = document.getElementById("barra-perfil");
            barra.innerHTML = "";
            for (let i = 0; i < 7; i++) {
                const seg = document.createElement("span");
                seg.className = "ofensiva__seg" + (i < dias ? " ofensiva__seg--on" : "");
                barra.appendChild(seg);
            }
        })();
    </script>

<script src="js/assistente.js"></script>

</body>
</html>
