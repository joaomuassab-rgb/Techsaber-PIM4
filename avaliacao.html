<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>TechSaber+ | Avaliação</title>

    <link rel="stylesheet" href="css/reset.css">

</head>

<body class="pagina-avaliacao">

    <!-- NAVBAR -->
    <header class="topo">
        <nav class="topo-nav">
            <a href="dashboard-aluno.html" class="logo">TechSaber+</a>
            <div class="topo-botoes">
                <button class="btn-voltar-pagina" onclick="history.back()">Voltar</button>
                <a href="dashboard-aluno.html" class="btn-sair-pagina">Sair</a>
            </div>
        </nav>
    </header>

    <main class="aval-main">

        <!-- CABEÇALHO: título e progresso -->
        <header class="aval-cabecalho">
            <p class="eyebrow">Avaliação final</p>
            <h1 id="aval-titulo"></h1>
            <p class="aval-progresso" id="aval-progresso"></p>
            <div class="aval-barra" aria-hidden="true">
                <span class="aval-barra__preench" id="aval-barra-preench"></span>
            </div>
        </header>

        <!-- CARTÃO DA QUESTÃO ATUAL -->
        <section class="aval-card" id="aval-card">
            <h2 id="aval-pergunta"></h2>
            <ul class="aval-opcoes" id="aval-opcoes"></ul>
            <button class="btn-cta aval-enviar" id="btn-enviar" onclick="enviarResposta()" disabled>
                Enviar resposta
            </button>
        </section>

    </main>

    <script>

           As respostas corretas estão alternadas entre A, B, C e D. */

            { pergunta: "O que é o DOCTYPE?", opcoes: ["Instrução que diz ao navegador qual versão do HTML usar", "Um tipo de comentário", "Uma tag de script", "Uma tag de estilo"], correta: 0 },

            { pergunta: "O que é um elemento inline?", opcoes: ["Ocupa apenas a largura necessária (ex: span)", "Cria novos blocos", "Define margens automáticas", "Ocupa toda a largura disponível"], correta: 0 },
            { pergunta: "O que é especificidade no CSS?", opcoes: ["Tamanho do arquivo CSS", "Regra que define qual estilo prevalece quando há conflito", "Número de seletores usados", "Velocidade de carregamento"], correta: 1 },
            { pergunta: "O que faz a pseudoclasse ':hover'?", opcoes: ["Define foco no elemento", "Oculta o elemento", "Aplica estilos quando o usuário passa o mouse", "Cria animações"], correta: 2 }

            { pergunta: "O que é o Garbage Collector?", opcoes: ["Sistema automático de gerenciamento de memória", "Um framework de testes", "Um servidor de arquivos", "Um tipo de banco de dados"], correta: 0 },
            { pergunta: "O que diferencia uma 'struct' de uma 'class'?", opcoes: ["Não há diferença", "Struct é tipo de valor, Class é tipo de referência", "Class é mais rápida", "Struct não aceita métodos"], correta: 1 },
            { pergunta: "Para que serve 'using' no topo do arquivo?", opcoes: ["Inicializar objetos", "Criar variáveis globais", "Para importar namespaces", "Definir o tipo de retorno"], correta: 2 },
            { pergunta: "O que é uma Interface em C#?", opcoes: ["Um tipo de variável", "Uma herança múltipla", "Uma classe abstrata", "Um contrato que define métodos sem implementação"], correta: 3 },
            { pergunta: "Explique o modificador 'static'.", opcoes: ["Pertence à classe em si, não a uma instância", "Impede herança", "Cria métodos virtuais", "Torna o método privado"], correta: 0 },
            { pergunta: "Qual a função do bloco 'try-catch'?", opcoes: ["Melhorar performance", "Tratamento de exceções e erros", "Criar loops", "Importar bibliotecas"], correta: 1 },
            { pergunta: "O que é LINQ?", opcoes: ["Um tipo de interface", "Um banco de dados NoSQL", "Linguagem de consulta integrada para coleções de dados", "Um framework de UI"], correta: 2 },
            { pergunta: "Utilidade do 'async/await'?", opcoes: ["Compilar código mais rápido", "Gerenciar arquivos", "Criar interfaces gráficas", "Melhorar responsividade evitando bloqueio da thread"], correta: 3 }
        ]
    },
    "Banco-de-Dados": {
        titulo: "Avaliação Banco de Dados",
        perguntas: [
            { pergunta: "O que representam as propriedades ACID?", opcoes: ["Comandos de criação de tabelas", "Tipos de índices", "Tipos de dados no SQL", "Garantias de confiabilidade em transações"], correta: 3 },
            { pergunta: "SQL vs NoSQL: qual a principal diferença?", opcoes: ["SQL é relacional; NoSQL é flexível/não-relacional", "NoSQL é mais seguro", "Não há diferença", "SQL é mais moderno"], correta: 0 },
            { pergunta: "O que é uma Chave Estrangeira (FK)?", opcoes: ["Uma senha de acesso", "Campo que cria um vínculo entre duas tabelas", "Um índice primário", "Um tipo de view"], correta: 1 },
            { pergunta: "Para que serve o comando UPDATE?", opcoes: ["Criar novas colunas", "Buscar dados", "Deletar tabelas", "Modificar dados já existentes"], correta: 3 },
            { pergunta: "O que faz o comando GROUP BY?", opcoes: ["Filtra registros", "Cria índices", "Ordena os resultados", "Agrupa linhas com os mesmos valores"], correta: 3 },
            { pergunta: "O que é um Data Warehouse?", opcoes: ["Sistema de armazenamento consolidado para análise", "Um comando SQL", "Um banco de dados temporário", "Um tipo de tabela"], correta: 0 },
            { pergunta: "Função do comando DELETE?", opcoes: ["Modificar registros", "Criar tabelas", "Remover registros de uma tabela", "Buscar dados"], correta: 2 },
            { pergunta: "O que é uma View?", opcoes: ["Um procedimento armazenado", "Um backup do banco", "Uma tabela virtual baseada em uma consulta SQL", "Um tipo de índice"], correta: 2 },
            { pergunta: "O que significa o valor NULL?", opcoes: ["Representa a ausência de valor", "Valor padrão do sistema", "Zero numérico", "Texto vazio"], correta: 0 },
            { pergunta: "O que faz o comando ORDER BY?", opcoes: ["Filtra registros", "Ordena resultados ascendente ou descendente", "Cria chaves primárias", "Agrupa resultados"], correta: 1 }

    },
    "Engenharia-de-Software": {
        titulo: "Avaliação Engenharia de Software",
        perguntas: [
            { pergunta: "O que é o Manifesto Ágil?", opcoes: ["Documento que prioriza pessoas e entregas sobre processos rígidos", "Conjunto de regras matemáticas", "Contrato jurídico de desenvolvimento", "Manual técnico da linguagem UML"], correta: 0 },
            { pergunta: "Defina Dívida Técnica.", opcoes: ["Custo de licenças de software", "Custo futuro de refatoração por escolhas rápidas", "Multa por atraso de projeto", "Tempo gasto em reuniões"], correta: 1 },
            { pergunta: "O que é Integração Contínua (CI)?", opcoes: ["Revisão de código semanal", "Reunião diária do time", "Prática de mesclar código várias vezes ao dia", "Entrega final do produto"], correta: 2 },
            { pergunta: "O que diz a Regra de Pareto em testes?", opcoes: ["50% do tempo é gasto em testes", "Todos os bugs devem ser corrigidos antes do deploy", "100% dos testes devem passar", "80% dos defeitos estão em 20% dos módulos"], correta: 3 },
            { pergunta: "Diferença entre Teste Unitário e de Integração?", opcoes: ["São a mesma coisa", "Integração é feito antes do Unitário", "Unitário é mais completo", "Unitário testa partes isoladas; Integração testa o conjunto"], correta: 3 },
            { pergunta: "O que é Refatoração?", opcoes: ["Adicionar novas funcionalidades", "Melhorar a estrutura sem alterar o comportamento externo", "Reescrever o sistema do zero", "Corrigir bugs críticos"], correta: 1 },
            { pergunta: "Para que serve o Diagrama de Sequência no UML?", opcoes: ["Criar wireframes", "Mostrar a estrutura de classes", "Mostrar a ordem de interações entre objetos no tempo", "Definir o banco de dados"], correta: 2 },
            { pergunta: "O que é MVP?", opcoes: ["Documento de requisitos", "Metodologia de gestão", "Produto mais caro do mercado", "Versão mais simples para validação de mercado"], correta: 3 },
            { pergunta: "O que caracteriza Microserviços?", opcoes: ["Serviços pequenos e independentes que se comunicam", "Banco de dados único", "Interface monolítica", "Um único serviço centralizado"], correta: 0 },
            { pergunta: "O que é o Product Backlog?", opcoes: ["Lista de bugs do sistema", "Lista ordenada de tudo necessário para o produto", "Relatório de Sprint", "Documento de arquitetura"], correta: 1 }
        ]
    },
    "Soft-Skills": {
        titulo: "Avaliação Soft Skills",
        perguntas: [
            { pergunta: "O que é feedback construtivo?", opcoes: ["Crítica sem solução", "Retorno que aponta melhorias de forma respeitosa", "Elogio exagerado", "Avaliação anual de desempenho"], correta: 1 },
            { pergunta: "O que é empatia no trabalho?", opcoes: ["Trabalhar isoladamente", "Ignorar os problemas dos colegas", "Capacidade de se colocar no lugar do outro", "Dar ordens sem explicação"], correta: 2 },
            { pergunta: "Como resolver conflitos em equipe?", opcoes: ["Ouvir todas as partes e buscar consenso", "Reportar ao gestor imediatamente", "Ignorar o problema", "Impor sua opinião"], correta: 0 },
            { pergunta: "O que é proatividade?", opcoes: ["Agir antecipadamente sem precisar ser solicitado", "Fazer apenas o mínimo necessário", "Delegar todas as tarefas", "Esperar ordens para agir"], correta: 0 },
            { pergunta: "Qual a importância da escuta ativa?", opcoes: ["Nenhuma, o que importa é falar", "Compreender verdadeiramente o que o outro comunica", "Apenas para reuniões formais", "Somente para líderes"], correta: 1 },
            { pergunta: "O que é resiliência profissional?", opcoes: ["Trabalhar sob pressão sempre", "Evitar desafios difíceis", "Capacidade de se adaptar e superar adversidades", "Nunca cometer erros"], correta: 2 },
            { pergunta: "Para que serve o networking?", opcoes: ["Aumentar seguidores nas redes sociais", "Apenas para vendedores", "Apenas para conseguir emprego", "Construir relações profissionais mutuamente benéficas"], correta: 3 },
            { pergunta: "O que é criatividade no ambiente de trabalho?", opcoes: ["Gerar novas ideias e soluções para problemas", "Ignorar processos estabelecidos", "Trabalhar de forma desorganizada", "Fazer coisas sem planejamento"], correta: 0 },
            { pergunta: "O que caracteriza um bom líder?", opcoes: ["Controlar e microgerenciar a equipe", "Inspirar, delegar e desenvolver as pessoas", "Tomar todas as decisões sozinho", "Evitar conflitos a qualquer custo"], correta: 1 },
            { pergunta: "Qual a importância da inteligência emocional?", opcoes: ["Somente em situações de crise", "Nenhuma no ambiente profissional", "Gerenciar emoções para tomar decisões equilibradas", "Apenas para profissionais de RH"], correta: 2 }
        ]
    },
    "Acessibilidade-Libras": {
        titulo: "Avaliação Libras",
        perguntas: [
            { pergunta: "Qual a lei da Libras no Brasil?", opcoes: ["Lei 9.394 de 1996", "Lei 8.069 de 1990", "Lei 10.436 de 2002", "Lei 13.146 de 2015"], correta: 2 },
            { pergunta: "O que caracteriza a Cultura Surda?", opcoes: ["Uso exclusivo de leitura labial", "Dependência de intérpretes", "Ausência de comunicação", "Valores e costumes próprios da comunidade surda"], correta: 3 },
            { pergunta: "O que é um Sinal-Nome?", opcoes: ["Identificação única dada a uma pessoa pela comunidade surda", "Uma forma de assinatura", "Um sinal universal", "O nome escrito em Libras"], correta: 0 },
            { pergunta: "Qual o papel do intérprete de Libras?", opcoes: ["Substituir a Libras pelo português", "Traduzir e mediar a comunicação entre ouvintes e surdos", "Ensinar Libras nas escolas", "Criar novos sinais"], correta: 1 },
            { pergunta: "O que são os Classificadores?", opcoes: ["Expressões faciais específicas", "Categorias gramaticais", "Sinais que descrevem formas, tamanhos ou ações", "Tipos de alfabetos manuais"], correta: 2 },
            { pergunta: "O que é a Configuração de Mão?", opcoes: ["A direção do movimento", "A expressão facial usada", "A velocidade do sinal", "O formato que a mão assume ao realizar um sinal"], correta: 3 },
            { pergunta: "O que significa Inclusão?", opcoes: ["Eliminar barreiras e garantir participação plena de todos", "Criar escolas especiais", "Adaptar apenas o ambiente físico", "Separar pessoas com deficiência"], correta: 0 },
            { pergunta: "Como se diz 'Oi' em Libras?", opcoes: ["Acenar com a mão aberta", "Através de configuração específica (letras O e I)", "Bater palmas", "Apontar para si mesmo"], correta: 1 },
            { pergunta: "Pessoa surda pode dirigir?", opcoes: ["Somente com acompanhante", "Não, é proibido por lei", "Sim, utilizando sinalizações visuais e retrovisores", "Apenas em velocidade reduzida"], correta: 2 },
            { pergunta: "O que é o ponto de articulação?", opcoes: ["A velocidade de execução", "O número de repetições", "A intensidade do sinal", "O local no corpo onde o sinal é realizado"], correta: 3 }
        ]
    },
    "Inteligencia-Artificial": {
        titulo: "Avaliação Inteligência Artificial",
        perguntas: [
            { pergunta: "O que são Redes Neurais?", opcoes: ["Tipos de banco de dados", "Algoritmos de busca", "Redes de computadores", "Modelos matemáticos inspirados no cérebro"], correta: 3 },
            { pergunta: "O que é o PNL (NLP)?", opcoes: ["Processamento de Linguagem Natural", "Protocolo de Rede Local", "Plataforma de Nuvem Linux", "Programação de Nível Lógico"], correta: 0 },
            { pergunta: "O que caracteriza o Big Data?", opcoes: ["Pequenos volumes de dados precisos", "Volumes massivos de dados para treinar modelos", "Dados organizados em planilhas", "Banco de dados relacionais"], correta: 1 },
            { pergunta: "O que é o Teste de Turing?", opcoes: ["Teste de segurança de sistemas", "Teste de velocidade de processamento", "Teste para verificar se uma máquina se passa por humano", "Avaliação de algoritmos"], correta: 2 },
            { pergunta: "Importância da Ética na IA?", opcoes: ["Apenas para empresas grandes", "Somente em IA médica", "Não é importante", "Garantir transparência, segurança e evitar danos sociais"], correta: 3 },
            { pergunta: "O que é Deep Learning?", opcoes: ["Subcampo do ML que usa múltiplas camadas de redes neurais", "Tipo de banco de dados", "Linguagem de programação", "Aprendizado superficial"], correta: 0 },
            { pergunta: "O que é IA Forte (AGI)?", opcoes: ["IA para jogos", "IA teórica com inteligência igual ou superior à humana", "IA para reconhecimento facial", "IA para tradução"], correta: 1 },
            { pergunta: "Função de um Algoritmo de IA?", opcoes: ["Configurar redes", "Criar interfaces visuais", "Definir regras e cálculos para processar dados", "Gerenciar banco de dados"], correta: 2 },
            { pergunta: "O que é Treinamento de Modelo?", opcoes: ["Criar novos algoritmos", "Testar a velocidade do sistema", "Instalar softwares de IA", "Ajustar parâmetros da IA usando dados conhecidos"], correta: 3 },
            { pergunta: "O que é um Chatbot?", opcoes: ["Programa de IA para simular conversas com usuários", "Um tipo de firewall", "Um sistema de backup", "Um vírus de computador"], correta: 0 }
        ]
    }
        };

        /* Lê o curso da URL. Se não existir, usa Front-End */
        const params   = new URLSearchParams(window.location.search);
        const cursoKey = todasAvaliacoes[params.get("curso")] ? params.get("curso") : "Front-End";
        const avaliacao = todasAvaliacoes[cursoKey];

        const TOTAL_MINIMO = 7;
        let atual = 0;
        let acertos = 0;
        let respostaSelecionada = null;

        document.getElementById("aval-titulo").textContent = avaliacao.titulo;

        /* Mostra a questão atual e atualiza a barra de progresso */
        function mostrarPergunta() {
            const q     = avaliacao.perguntas[atual];
            const total = avaliacao.perguntas.length;

            document.getElementById("aval-progresso").textContent = `Questão ${atual + 1} de ${total}`;
            document.getElementById("aval-barra-preench").style.width = ((atual / total) * 100) + "%";
            document.getElementById("aval-pergunta").textContent = `${atual + 1}. ${q.pergunta}`;

            const opcoes = document.getElementById("aval-opcoes");
            opcoes.innerHTML = "";
            respostaSelecionada = null;
            document.getElementById("btn-enviar").disabled = true;

            const letras = ["A", "B", "C", "D"];
            q.opcoes.forEach((opcao, i) => {
                const li = document.createElement("li");
                li.className = "aval-opcao";
                li.setAttribute("tabindex", "0");
                li.innerHTML = `<span class="opcao-letra">${letras[i]}</span><span class="opcao-texto"></span>`;
                li.querySelector(".opcao-texto").textContent = opcao;
                li.onclick = () => selecionarOpcao(li, i);
                li.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        selecionarOpcao(li, i);
                    }
                };
                opcoes.appendChild(li);
            });
        }

        function selecionarOpcao(el, indice) {
            document.querySelectorAll(".aval-opcao").forEach(op => op.classList.remove("selecionada"));
            el.classList.add("selecionada");
            respostaSelecionada = indice;
            document.getElementById("btn-enviar").disabled = false;
        }

        /* Pinta a correta de verde e a escolhida errada de vermelho */
        function enviarResposta() {
            const q      = avaliacao.perguntas[atual];
            const opcoes = document.querySelectorAll(".aval-opcao");

            opcoes.forEach((op, i) => {
                op.onclick = null;
                op.onkeydown = null;
                op.removeAttribute("tabindex");
                op.classList.add("respondida");
                if (i === q.correta) op.classList.add("correta");
                else if (i === respostaSelecionada) op.classList.add("errada");
            });

            if (respostaSelecionada === q.correta) acertos++;
            document.getElementById("btn-enviar").disabled = true;

            setTimeout(() => {
                atual++;
                if (atual < avaliacao.perguntas.length) {
                    mostrarPergunta();
                } else {
                    mostrarResultado();
                }
            }, 1400);
        }

        /* Tela final: 7 de 10 para passar */
        function mostrarResultado() {
            const total  = avaliacao.perguntas.length;
            const passou = acertos >= TOTAL_MINIMO;

            document.getElementById("aval-barra-preench").style.width = "100%";

            if (passou) {
                localStorage.setItem(`concluido-${cursoKey}`, "true");
                if (window.TechSaberOfensiva) TechSaberOfensiva.registrarAtividade();
                if (window.TechSaberXP) TechSaberXP.ganhar("aval-" + cursoKey, 50, "avaliação aprovada");
            }

            const icone = passou
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3"/><path d="M17 6h3v1a3 3 0 0 1-3 3"/></svg>`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>`;

            document.querySelector(".aval-main").innerHTML = `
                <section class="aval-resultado" aria-live="polite">
                    <span class="aval-resultado__icone ${passou ? "aval-resultado__icone--ok" : "aval-resultado__icone--nao"}">${icone}</span>
                    <p class="eyebrow">${passou ? "Módulo concluído" : "Quase lá"}</p>
                    <h1>${passou ? "Parabéns!" : "Continue estudando"}</h1>
                    <div class="aval-numero"><span>${acertos}</span><small>/ ${total}</small></div>
                    <p class="aval-resultado__texto">${passou
                        ? "Você concluiu este módulo. A trilha já está atualizada."
                        : `Você precisa acertar pelo menos ${TOTAL_MINIMO} questões para concluir o módulo.`}</p>
                    <nav class="aval-botoes">
                        ${passou
                            ? `<a href="curso.html?curso=${cursoKey}" class="btn-cta">Ver trilha</a>`
                            : `<button class="btn-cta" onclick="location.reload()">Tentar novamente</button>`}
                        <a href="dashboard-aluno.html" class="btn-vidro">Início</a>
                    </nav>
                </section>
            `;
        }

        mostrarPergunta();
    </script>

    <script src="js/ofensiva.js"></script>
    <script src="js/xp.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
